<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>비밀번호 금고</title>
<meta name="theme-color" content="#2E5E4E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="비밀번호 금고">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="referrer" content="no-referrer">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;-webkit-text-size-adjust:100%}
[hidden]{display:none!important}
:root{
  --bg:#F2F5F3; --surface:#FFFFFF; --ink:#172420; --muted:#5C6B64; --line:#D9E1DC;
  --accent:#2E5E4E; --accent-soft:#E1EEE8; --danger:#B4372F; --danger-soft:#F8E6E4; --warn:#9A6B00; --warn-soft:#FBF1D6; --ok:#2C7A4B;
  --font-body:-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --font-mono:ui-monospace,Menlo,Consolas,monospace;
  --r:12px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F1613; --surface:#172019; --ink:#E4ECE7; --muted:#95A39B; --line:#28342E;
  --accent:#7FC2A6; --accent-soft:#1C3229; --danger:#E5877F; --danger-soft:#3A1F1C; --warn:#E3B95A; --warn-soft:#3A2F14; --ok:#6CC491; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1613; --surface:#172019; --ink:#E4ECE7; --muted:#95A39B; --line:#28342E;
  --accent:#7FC2A6; --accent-soft:#1C3229; --danger:#E5877F; --danger-soft:#3A1F1C; --warn:#E3B95A; --warn-soft:#3A2F14; --ok:#6CC491; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:14px 8px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
h1{font-size:22px;font-weight:700;margin:0;letter-spacing:-.01em}
.count{font-family:var(--font-mono);font-size:12px;color:var(--muted)}
.top .right{display:flex;align-items:center;gap:8px}
.menu{border:1px solid var(--line);background:var(--surface);border-radius:10px;height:34px;padding:0 10px;font-size:13px}
.search{margin-top:10px;display:flex;gap:8px}
.search input{flex:1;min-width:0;height:44px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:0 14px}
.search select{height:44px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:0 8px}
.rail{display:flex;gap:6px;overflow-x:auto;padding-block:10px 4px;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip b{font-family:var(--font-mono);font-weight:500;font-size:11px;opacity:.7;margin-left:4px}

main{padding-block:4px 120px}
.list{display:flex;flex-direction:column;gap:8px}
.item{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px;text-align:left;width:100%}
.ava{width:44px;height:44px;border-radius:10px;display:grid;place-items:center;font-weight:700;font-size:18px;color:#fff;flex:none}
.meta{min-width:0}
.meta .n{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:6px}
.meta .c{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag{display:inline-block;font-size:11px;border-radius:4px;padding:0 6px;margin-top:3px;margin-right:4px}
.tag.cat{color:var(--accent);background:var(--accent-soft)}
.tag.warn{color:var(--warn);background:var(--warn-soft)}
.tag.bad{color:var(--danger);background:var(--danger-soft)}
.star{color:var(--warn);font-size:14px}
.quick{display:flex;gap:4px}
.qbtn{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--bg);display:grid;place-items:center;color:var(--accent);padding:0}
.qbtn svg{width:18px;height:18px}

.empty{text-align:center;padding:48px 12px;color:var(--muted)}
.empty h2{color:var(--ink);font-size:17px;margin:12px 0 4px}

.fab{position:fixed;right:calc(20px + env(safe-area-inset-right,0px));bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:6;height:56px;padding:0 22px;border-radius:28px;border:0;background:var(--accent);color:#fff;font-weight:600;display:flex;align-items:center;gap:8px;box-shadow:0 6px 18px rgba(16,40,30,.25)}
:root[data-theme="dark"] .fab{color:#0E1A14}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .fab{color:#0E1A14}}
.fab svg{width:20px;height:20px}

.sheet{position:fixed;inset:0;z-index:20;background:var(--bg);overflow-y:auto;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.bar{position:sticky;top:0;z-index:2;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:8px;padding-block:10px;border-bottom:1px solid var(--line)}
.bar h2{font-size:16px;margin:0;flex:1;text-align:center}
.tbtn{border:0;background:none;color:var(--accent);font-weight:600;padding:8px 4px;min-width:56px}
.tbtn.l{text-align:left}.tbtn.r{text-align:right}
.body{padding-block:16px 40px;display:flex;flex-direction:column;gap:16px}

.who{display:flex;align-items:center;gap:12px}
.who .ava{width:56px;height:56px;font-size:24px;border-radius:14px}
.who h3{font-size:20px;margin:0;line-height:1.3}
.who .alt{color:var(--muted);font-size:13px;word-break:break-all}
.rows{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.row{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:10px 12px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .k{font-size:12px;color:var(--muted)}
.row .v{word-break:break-all;min-width:0}
.row a.v{color:var(--accent);text-decoration:none}
.row .num{font-family:var(--font-mono);font-size:14.5px}
.acts{display:flex;gap:6px}
.memo{white-space:pre-wrap;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.btn{flex:1;min-width:120px;height:44px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);font-weight:500}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
:root[data-theme="dark"] .btn.primary{color:#0E1A14}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.primary{color:#0E1A14}}
.btn.danger{color:var(--danger)}
.btn:disabled{opacity:.5;cursor:default}
.small{font-size:12px;color:var(--muted)}
.status{font-size:13px;padding:8px 12px;border-radius:8px;background:var(--accent-soft);color:var(--accent)}
.status.err{background:transparent;border:1px solid var(--danger);color:var(--danger)}
.status.warn{background:var(--warn-soft);color:var(--warn)}
form{display:flex;flex-direction:column;gap:12px}
.f label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
.f input,.f select,.f textarea{width:100%;box-sizing:border-box;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:10px 12px}
.f textarea{min-height:72px;resize:vertical}
.pw{display:flex;gap:6px}
.pw input{flex:1;min-width:0;font-family:var(--font-mono)}
.x{flex:none;width:44px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--muted);padding:0}
.x svg{width:18px;height:18px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:420px){.two{grid-template-columns:1fr}}
.meter{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:6px}
.meter i{display:block;height:100%;width:0;transition:width .2s}
.meter.s0 i{width:10%;background:var(--danger)}.meter.s1 i{width:35%;background:var(--danger)}.meter.s2 i{width:60%;background:var(--warn)}.meter.s3 i{width:80%;background:var(--ok)}.meter.s4 i{width:100%;background:var(--ok)}
.mlabel{font-size:12px;color:var(--muted);margin-top:3px;display:flex;justify-content:space-between}
.gen{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:10px}
.gen .out{font-family:var(--font-mono);font-size:16px;word-break:break-all;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px;user-select:all;min-height:24px}
.gen .opts{display:flex;flex-wrap:wrap;gap:8px 14px;font-size:13px}
.gen .opts label{display:flex;align-items:center;gap:4px}
.gen input[type=range]{width:100%}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom,0px));z-index:50;background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:999px;font-size:14px;max-width:90vw;text-align:center}
.confirm{background:var(--surface);border:1px solid var(--danger);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:8px}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .22s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}}

.lock{position:fixed;inset:0;z-index:30;background:var(--bg);display:grid;place-items:center;padding:24px;overflow-y:auto}
.lock .box{width:100%;max-width:360px;display:flex;flex-direction:column;gap:14px}
.lock .logo{width:72px;height:72px;border-radius:20px;background:var(--accent);display:grid;place-items:center;margin:0 auto 4px}
.lock .logo svg{width:38px;height:38px;color:#fff}
.lock h2{text-align:center;margin:0;font-size:20px}
.lock p{text-align:center;color:var(--muted);margin:0;font-size:14px}
.hint{font-size:12px;color:var(--muted);line-height:1.5}
.hint b{color:var(--ink)}
.sec{display:flex;flex-direction:column;gap:8px}
.sec h3{font-size:14px;margin:4px 0 0;color:var(--muted);font-weight:600}
.pick{position:relative;overflow:hidden}
.pick input{position:absolute;inset:0;opacity:0;cursor:pointer}
.kv{display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px}
.kv select{border:1px solid var(--line);border-radius:8px;background:var(--bg);padding:6px 8px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="top"><h1>비밀번호 금고</h1><div class="right"><span class="count" id="count"></span><button class="menu" id="lockBtn" title="잠그기">잠금</button><button class="menu" id="menuBtn">백업·설정</button></div></div>
    <div class="search">
      <input id="q" type="search" placeholder="사이트, 아이디, 메모 검색" autocomplete="off">
      <select id="sort" aria-label="정렬"><option value="name">이름순</option><option value="new">최신순</option><option value="used">최근 사용순</option></select>
    </div>
    <div class="rail" id="rail" role="toolbar" aria-label="분류"></div>
  </header>
  <main><div class="list" id="list"></div><div id="emptyBox"></div></main>
</div>
<button class="fab" id="fab" aria-label="항목 추가"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>추가</button>
<div class="lock" id="lock"></div>
<div class="sheet" id="detail" hidden></div>
<div class="sheet" id="editor" hidden></div>
<div class="sheet" id="settings" hidden></div>
<div class="toast" id="toast" hidden></div>
<script src="vault.js"></script>
<script src="app.js"></script>
</body>
</html>
