<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>명함첩</title>
<meta name="theme-color" content="#1F5F8B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="명함첩">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;-webkit-text-size-adjust:100%}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<style>

/* Layout: single-column phone app — sticky search bar, category rail, card list; detail & editor slide up as full sheets */
:root{
  --bg:#F3F5F7; --surface:#FFFFFF; --ink:#18212E; --muted:#5E6B7B; --line:#DCE2E8;
  --accent:#1F5F8B; --accent-soft:#E3EEF6; --danger:#B4372F; --ok:#2C7A4B;
  --font-body:-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --font-mono:ui-monospace,Menlo,monospace;
  --r:12px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#10151C; --surface:#18202A; --ink:#E6EBF1; --muted:#97A3B2; --line:#2A3542;
  --accent:#6FB0DD; --accent-soft:#1D3243; --danger:#E5877F; --ok:#6CC491; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10151C; --surface:#18202A; --ink:#E6EBF1; --muted:#97A3B2; --line:#2A3542;
  --accent:#6FB0DD; --accent-soft:#1D3243; --danger:#E5877F; --ok:#6CC491; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:14px 8px}
.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
h1{font-size:22px;font-weight:700;margin:0;letter-spacing:-.01em}
.count{font-family:var(--font-mono);font-size:12px;color:var(--muted)}
.search{margin-top:10px;display:flex;gap:8px}
.search input{flex:1;min-width:0;height:44px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:0 14px}
.search select{height:44px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:0 8px}
.rail{display:flex;gap:6px;overflow-x:auto;padding-block:10px 4px;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip b{font-family:var(--font-mono);font-weight:500;font-size:11px;opacity:.7;margin-left:4px}

main{padding-block:4px 120px}
.list{display:flex;flex-direction:column;gap:8px}
.item{display:grid;grid-template-columns:72px 1fr auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px;text-align:left;width:100%}
.thumb{width:72px;aspect-ratio:1.75;border-radius:6px;object-fit:cover;background:var(--accent-soft);display:block}
.thumb.ph{display:grid;place-items:center;font-weight:600;color:var(--accent);font-size:18px}
.meta{min-width:0}
.meta .n{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta .c{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cat{display:inline-block;font-size:11px;color:var(--accent);background:var(--accent-soft);border-radius:4px;padding:0 6px;margin-top:3px}
.quick{display:flex;gap:4px}
.qbtn{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--bg);display:grid;place-items:center;text-decoration:none;color:var(--accent)}
.qbtn svg{width:18px;height:18px}

.empty{text-align:center;padding:48px 12px;color:var(--muted)}
.empty h2{color:var(--ink);font-size:17px;margin:12px 0 4px}
.empty .art{width:150px;margin:0 auto}

.fab{position:fixed;right:calc(20px + env(safe-area-inset-right,0px));bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:6;height:56px;padding:0 22px;border-radius:28px;border:0;background:var(--accent);color:#fff;font-weight:600;display:flex;align-items:center;gap:8px;box-shadow:0 6px 18px rgba(16,40,60,.25)}
:root[data-theme="dark"] .fab{color:#0E1A24}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .fab{color:#0E1A24}}
.fab svg{width:20px;height:20px}

.sheet{position:fixed;inset:0;z-index:20;background:var(--bg);overflow-y:auto;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.bar{position:sticky;top:0;z-index:2;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:8px;padding-block:10px;border-bottom:1px solid var(--line)}
.bar h2{font-size:16px;margin:0;flex:1;text-align:center}
.tbtn{border:0;background:none;color:var(--accent);font-weight:600;padding:8px 4px;min-width:56px}
.tbtn.l{text-align:left}.tbtn.r{text-align:right}
.body{padding-block:16px 40px;display:flex;flex-direction:column;gap:16px}

.cardimg{width:100%;border-radius:var(--r);border:1px solid var(--line);display:block;background:var(--surface)}
.imgs{display:flex;gap:8px}
.imgs img{flex:1;min-width:0}
.who h3{font-size:22px;margin:0;line-height:1.3}
.who .alt{color:var(--muted);font-size:14px}
.who .role{margin-top:4px}
.rows{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.row{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:10px 12px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .k{font-size:12px;color:var(--muted)}
.row .v{word-break:break-word;min-width:0}
.row a.v{color:var(--accent);text-decoration:none}
.row .num{font-family:var(--font-mono);font-size:14.5px;font-variant-numeric:tabular-nums}
.acts{display:flex;gap:6px}
.memo{white-space:pre-wrap;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.btn{flex:1;min-width:120px;height:44px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);font-weight:500}
.btn.danger{color:var(--danger)}
.small{font-size:12px;color:var(--muted)}

.drop{border:1.5px dashed var(--line);border-radius:var(--r);background:var(--surface);padding:18px;display:flex;flex-direction:column;gap:10px;align-items:center;text-align:center}
.drop .pv{display:flex;gap:8px;width:100%}
.drop .pv img{flex:1;min-width:0;border-radius:8px}
.pickrow{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.pick{position:relative;overflow:hidden;border:1px solid var(--line);border-radius:999px;padding:8px 14px;background:var(--bg);font-size:14px}
.pick input{position:absolute;inset:0;opacity:0;cursor:pointer}
.status{font-size:13px;padding:8px 12px;border-radius:8px;background:var(--accent-soft);color:var(--accent)}
.status.err{background:transparent;border:1px solid var(--danger);color:var(--danger)}
form{display:flex;flex-direction:column;gap:12px}
.f label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
.f input,.f select,.f textarea{width:100%;box-sizing:border-box;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:10px 12px}
.f textarea{min-height:72px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:420px){.two{grid-template-columns:1fr}}
.multi{display:flex;flex-direction:column;gap:6px}
.mrow{display:flex;gap:6px}
.mrow select{width:96px;flex:none}
.mrow input{flex:1;min-width:0}
.x{flex:none;width:40px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--muted)}
.add{align-self:flex-start;border:0;background:none;color:var(--accent);font-size:13px;padding:2px 0}
.zoom{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.92);display:grid;place-items:center;padding:16px}
.zoom img{max-height:100%;border-radius:8px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom,0px));z-index:50;background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:999px;font-size:14px}
.confirm{background:var(--surface);border:1px solid var(--danger);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:8px}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .22s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}}
.top .right{display:flex;align-items:center;gap:10px}
.menu{border:1px solid var(--line);background:var(--surface);border-radius:10px;height:34px;padding:0 10px;font-size:13px}
.raw summary{font-size:13px;color:var(--accent);cursor:pointer}
.raw pre{white-space:pre-wrap;font-family:var(--font-mono);font-size:12.5px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px;user-select:text}
label.btn.pick{border-radius:var(--r);background:var(--surface)}
.empty .art{display:block}
</style>

</head>
<body>
<div class="wrap">
  <header>
    <div class="top"><h1>명함첩</h1><div class="right"><span class="count" id="count"></span><button class="menu" id="menuBtn">백업·설정</button></div></div>
    <div class="search">
      <input id="q" type="search" placeholder="이름, 회사, 번호, 메모 검색" autocomplete="off">
      <select id="sort" aria-label="정렬"><option value="new">최신순</option><option value="name">이름순</option><option value="company">회사순</option></select>
    </div>
    <div class="rail" id="rail" role="toolbar" aria-label="분류"></div>
  </header>
  <main><div class="list" id="list"></div><div id="emptyBox"></div></main>
</div>
<button class="fab" id="fab" aria-label="명함 추가"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>명함 추가</button>
<div class="sheet" id="detail" hidden></div>
<div class="sheet" id="editor" hidden></div>
<div class="sheet" id="settings" hidden></div>
<div class="zoom" id="zoom" hidden><img id="zoomImg" alt="명함 확대"></div>
<div class="toast" id="toast" hidden></div>
<script src="lib/tesseract.min.js"></script>
<script src="parse.js"></script>
<script src="app.js"></script>
</body>
</html>
