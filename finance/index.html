<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>자산 대시보드</title>
<meta name="theme-color" content="#106E5A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="자산대시보드">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;-webkit-text-size-adjust:100%}
[hidden]{display:none!important}
</style>
<style>
:root{
  --bg:#F2F6F4; --surface:#FFFFFF; --ink:#152420; --muted:#5C6E67; --line:#DCE6E1;
  --accent:#106E5A; --accent-soft:#DFF0EA; --danger:#B4372F; --ok:#2C7A4B; --up:#C23B3B; --down:#1C6FD1;
  --font-body:-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --font-mono:ui-monospace,Menlo,monospace;
  --r:12px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0D1613; --surface:#15201C; --ink:#E7EFEB; --muted:#92A49C; --line:#263530;
  --accent:#58C7A8; --accent-soft:#17352B; --danger:#E5877F; --ok:#6CC491; --up:#E5877F; --down:#7FB4F2; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1613; --surface:#15201C; --ink:#E7EFEB; --muted:#92A49C; --line:#263530;
  --accent:#58C7A8; --accent-soft:#17352B; --danger:#E5877F; --ok:#6CC491; --up:#E5877F; --down:#7FB4F2; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:14px 8px;border-bottom:1px solid var(--line)}
.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
h1{font-size:20px;font-weight:700;margin:0;letter-spacing:-.01em}
.updated{font-family:var(--font-mono);font-size:11px;color:var(--muted)}

main{padding-block:16px calc(84px + env(safe-area-inset-bottom,0px))}
section.pane{display:flex;flex-direction:column;gap:14px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.card h2{font-size:14px;margin:0 0 10px;color:var(--muted);font-weight:600}
.card h2 .lbl{color:var(--ink)}

.fxRate{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.fxRate .num{font-size:34px;font-weight:700;font-family:var(--font-mono);letter-spacing:-.02em}
.chg{font-size:14px;font-weight:600;font-family:var(--font-mono)}
.chg.pos{color:var(--up)}.chg.neg{color:var(--down)}
.fxSub{color:var(--muted);font-size:13px;margin-top:2px}
.conv{display:flex;gap:8px;align-items:center;margin-top:12px;flex-wrap:wrap}
.conv input{width:120px;border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:9px 10px;font-family:var(--font-mono);text-align:right}
.conv .eq{color:var(--muted)}
.conv .res{font-family:var(--font-mono);font-weight:600;flex:1;min-width:120px;text-align:right}
.spark{width:100%;height:46px;display:block;margin-top:10px}
.spark.big{height:110px}
.segrow{display:flex;gap:6px;margin-top:12px;overflow-x:auto;scrollbar-width:none}
.segrow::-webkit-scrollbar{display:none}
.seg{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 13px;font-size:12.5px;color:var(--muted)}
.seg[aria-pressed="true"]{background:var(--accent);color:#fff;border-color:var(--accent)}
:root[data-theme="dark"] .seg[aria-pressed="true"]{color:#07140F}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .seg[aria-pressed="true"]{color:#07140F}}
.chartMeta{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted);margin-top:14px}
.chartMeta .pos{color:var(--up)}.chartMeta .neg{color:var(--down)}
.chartDates{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:2px}
.newsCard{border:1px solid var(--line);border-radius:10px;padding:13px;margin-top:10px}
.newsCard:first-child{margin-top:0}
.newsKo{font-weight:700;font-size:15.5px;line-height:1.4}
.newsEn{font-size:12px;color:var(--muted);margin-top:3px;line-height:1.4}
.newsDesc{font-size:13px;color:var(--ink);margin-top:8px;line-height:1.5}
.newsMeta{font-size:11.5px;color:var(--muted);margin-top:9px}
.newsMeta a{color:var(--accent);font-weight:600}
.bondCard{border:1px solid var(--line);border-radius:10px;padding:12px;margin-top:10px}
.bondCard:first-child{margin-top:0}
.bondName{font-weight:600;font-size:14.5px;margin-bottom:2px}
.bondStats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px 12px;margin-top:10px}
.bondStats > div{display:flex;flex-direction:column;gap:2px;min-width:0}
.bondStats .v{overflow-wrap:break-word}
.bondStats .k{font-size:11px;color:var(--muted)}
.bondStats .v{font-family:var(--font-mono);font-weight:600;font-size:13.5px}
.bondStats .v.hl{color:var(--accent);font-size:15.5px;font-weight:700}
.incBig{font-family:var(--font-mono);font-size:30px;font-weight:700;letter-spacing:-.5px;color:var(--accent)}
.incGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.incGrid .k{display:block;font-size:11px;color:var(--muted)}
.incGrid .v{font-family:var(--font-mono);font-weight:600;font-size:14px}
.incRow{display:grid;grid-template-columns:62px 1fr auto;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.incRow:first-of-type{border-top:0}
.incRow .m{font-family:var(--font-mono);font-size:12.5px;color:var(--muted)}
.incRow .amt{font-family:var(--font-mono);font-weight:700;font-size:14.5px}
.incBar{height:6px;background:var(--accent-soft);border-radius:3px;overflow:hidden}
.incBar i{display:block;height:100%;background:var(--accent)}
.incSub{grid-column:1/4;font-size:11.5px;color:var(--muted);margin-top:-2px;line-height:1.5}
.bondFoot{display:flex;align-items:center;gap:8px;margin-top:10px;flex-wrap:wrap}

.etfRow{display:grid;grid-template-columns:1fr auto auto;gap:4px 10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.etfRow:first-child{border-top:0}
.etfRow .sym{font-weight:700}
.etfRow .nm{font-size:12px;color:var(--muted);grid-column:1;margin-top:-2px}
.etfRow .px{font-family:var(--font-mono);font-weight:600;text-align:right}
.etfRow .pc{font-family:var(--font-mono);font-size:13px;text-align:right}
.etfRow .pc.pos{color:var(--up)}.etfRow .pc.neg{color:var(--down)}
.etfRow .err{color:var(--danger);font-size:12px;grid-column:2/4;text-align:right}
.etfRow .info{grid-column:1;min-width:0}
.etfRow .info .nm{grid-column:auto}
.etfRow .fin{grid-column:2/4;align-self:start;text-align:right;font-family:var(--font-mono);font-size:11px;line-height:1.55;color:var(--muted);white-space:nowrap}
.qtyRow{grid-column:1/4;display:flex;align-items:center;gap:8px;margin-top:4px;flex-wrap:wrap}
.qtyInput{width:84px;border:1px solid var(--line);border-radius:8px;background:var(--bg);padding:5px 8px;font-size:12.5px;color:inherit}
.etfAdd{display:flex;gap:8px;margin-top:10px}
.etfAdd input{flex:1;min-width:0;border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:9px 10px;text-transform:uppercase}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:42px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:14px;text-decoration:none;color:var(--ink)}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
:root[data-theme="dark"] .btn.primary{color:#07140F}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.primary{color:#07140F}}
.btn.sm{height:34px;padding:0 12px;font-size:13px}
.btn.ghost{color:var(--muted)}
.row{display:flex;gap:8px;flex-wrap:wrap}

.calc .f{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
.calc label{font-size:12px;color:var(--muted)}
.calc input,.calc select{border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:9px 10px;width:100%;box-sizing:border-box}
.calc .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.resultBox{background:var(--accent-soft);border-radius:10px;padding:12px;margin-top:6px}
.resultBox .big{font-size:22px;font-weight:700;font-family:var(--font-mono);color:var(--accent)}
.resultBox .small{font-size:12px;color:var(--muted);margin-top:2px}
.note{font-size:12px;color:var(--muted);margin-top:8px;line-height:1.5}

table.logtbl{width:100%;border-collapse:collapse;font-size:13.5px}
table.logtbl th{text-align:left;font-size:11px;color:var(--muted);font-weight:600;padding:4px 6px;border-bottom:1px solid var(--line)}
table.logtbl td{padding:7px 6px;border-bottom:1px solid var(--line);font-family:var(--font-mono)}
table.logtbl tr.top td{font-weight:700;color:var(--accent)}
table.logtbl td.name{font-family:var(--font-body);font-weight:500}
table.logtbl td.del{text-align:right}
.delbtn{border:0;background:none;color:var(--muted);font-size:12px;padding:4px}
.logform{display:none;gap:8px;margin-top:10px}
.logform.open{display:grid}
.logform .two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.logform input,.logform select{border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:8px 10px;width:100%;box-sizing:border-box;font-size:13.5px}
.empty2{text-align:center;color:var(--muted);font-size:13px;padding:14px 0}

.disclaim{font-size:11.5px;color:var(--muted);line-height:1.5;padding:4px 2px 2px}
.disclaim a,.note a{color:var(--accent);font-weight:600}
.status{font-size:13px;color:var(--muted);padding:4px 0}
.status.err{color:var(--danger)}

nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .inner{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav.tabs button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 2px 8px;color:var(--muted);font-size:11.5px;font-weight:600}
nav.tabs button svg{width:21px;height:21px}
nav.tabs button[aria-selected="true"]{color:var(--accent)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));z-index:50;background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:999px;font-size:14px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="top">
      <h1 id="paneTitle">환율</h1>
      <span class="updated" id="updatedAt"></span>
    </div>
  </header>
  <main>
    <section class="pane" id="pane-fx"></section>
    <section class="pane" id="pane-etf" hidden></section>
    <section class="pane" id="pane-muni" hidden></section>
    <section class="pane" id="pane-income" hidden></section>
    <section class="pane" id="pane-news" hidden></section>
  </main>
</div>
<nav class="tabs" role="tablist" aria-label="섹션">
  <div class="inner">
    <button role="tab" data-tab="fx" aria-selected="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 15l4-4 3 3 5-6"/><path d="M4 4v16h16"/></svg>
      환율
    </button>
    <button role="tab" data-tab="etf" aria-selected="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="12" width="4" height="8"/><rect x="10" y="7" width="4" height="13"/><rect x="16" y="3" width="4" height="17"/></svg>
      ETF
    </button>
    <button role="tab" data-tab="muni" aria-selected="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="10" width="18" height="10" rx="1"/><path d="M5 10l7-6 7 6"/></svg>
      채권
    </button>
    <button role="tab" data-tab="income" aria-selected="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="1.5"/><path d="M3 10h18M8 3v4M16 3v4"/><path d="M12 13v5M10 15.5c0-.8 1-1.3 2-1.3s2 .5 2 1.3-1 1.1-2 1.2-2 .5-2 1.3 1 1.3 2 1.3 2-.5 2-1.3"/></svg>
      배당
    </button>
    <button role="tab" data-tab="news" aria-selected="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="1.5"/><path d="M7 8h10M7 12h10M7 16h6"/></svg>
      뉴스
    </button>
  </div>
</nav>
<div class="toast" id="toast" hidden></div>
<script src="app.js"></script>
</body>
</html>
