<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>IQ 테스트</title>
<meta name="theme-color" content="#6B4FA0">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;-webkit-text-size-adjust:100%}
[hidden]{display:none!important}

:root{
  --bg:#F4F2F8; --surface:#FFFFFF; --ink:#1E1A2B; --muted:#675E7A; --line:#DED8E8;
  --accent:#6B4FA0; --accent-soft:#EBE3F5; --ok:#2C7A4B; --warn:#8A5A1E;
  --font-body:-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --font-mono:ui-monospace,Menlo,monospace;
  --r:14px;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#17131F; --surface:#211C2E; --ink:#ECE7F5; --muted:#A79CC0; --line:#342B46;
  --accent:#B49BE0; --accent-soft:#2C2440; --ok:#6CC491; --warn:#E3B06E; color-scheme:dark}}

html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.55}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

#app{max-width:560px;margin:0 auto;padding:16px max(16px,env(safe-area-inset-left,0px)) 48px max(16px,env(safe-area-inset-right,0px))}

.langbar{display:flex;justify-content:flex-end;gap:6px;padding-bottom:12px}
.seg{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-size:13px}
.seg.on{background:var(--accent);color:#fff;border-color:var(--accent)}

h1{font-size:24px;font-weight:700;margin:4px 0 6px;letter-spacing:-.01em}
.sub{color:var(--muted);margin:0 0 12px}
.warn{background:var(--accent-soft);color:var(--warn);border-radius:var(--r);padding:12px 14px;font-size:13px;margin:0 0 20px}
.warn.small{font-size:12.5px;color:var(--muted);background:transparent;padding:0 2px;margin-top:18px}

.age-row{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.age-row label{font-weight:600;font-size:14px}
.age-row input{width:84px;height:40px;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:0 12px;font-size:15px}
.age-note{color:var(--muted);font-size:12.5px;margin:0 0 20px}

.cards{display:flex;flex-direction:column;gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.card-title{font-weight:700;font-size:17px;margin-bottom:4px}
.card-sub{color:var(--muted);font-size:13px;margin-bottom:12px}

.btn{display:block;width:100%;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:12px 16px;font-size:15px;font-weight:600;text-align:center}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn.wide{margin-top:20px}

.progress{font-family:var(--font-mono);color:var(--muted);font-size:13px;margin-bottom:6px}
.bar{height:6px;border-radius:3px;background:var(--accent-soft);overflow:hidden;margin-bottom:16px}
.bar-fill{height:100%;background:var(--accent)}
.type-tag{display:inline-block;font-size:12px;color:var(--accent);background:var(--accent-soft);border-radius:6px;padding:3px 8px;margin-bottom:10px}
.stem{font-size:19px;font-weight:600;margin-bottom:18px;white-space:pre-wrap;word-break:break-word}

.options{display:flex;flex-direction:column;gap:8px}
.option{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:12px 14px;font-size:16px}
.option.selected{border-color:var(--accent);background:var(--accent-soft);font-weight:700}

.score-big{font-size:18px;font-weight:600;margin-bottom:14px}
.iq-box{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;text-align:center;margin-bottom:12px}
.iq-label{color:var(--muted);font-size:13px;margin-bottom:4px}
.iq-num{font-size:44px;font-weight:800;color:var(--accent);line-height:1}
.iq-class{margin-top:8px;font-weight:600}
.iq-age{margin-top:2px;color:var(--muted);font-size:12.5px}
.time-row{color:var(--muted);font-size:13px;margin-bottom:16px}

.bytype{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin-bottom:4px}
.bytype-title{font-weight:700;margin-bottom:8px;font-size:14px}
.bytype-row{font-size:14px;color:var(--muted);padding:2px 0}

.result-btns{display:flex;flex-direction:column;gap:8px;margin-top:20px}
</style>
</head>
<body>
<div id="app"></div>
<script src="app.js"></script>
</body>
</html>
